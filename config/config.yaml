project:
  name: "AI Portfolio Manager"
  currency: "INR"
  default_capital: 1000000

data:
  start_date: "2019-01-01"
  end_date: "2026-07-24"
  risk_free_rate: 0.065

markets:
  index: "^NSEI"
  etfs:
    - "NIFTYBEES.NS"
    - "GOLDBEES.NS"
    - "LIQUIDBEES.NS"

rebalancing:
  strategies:
    - "monthly"
    - "quarterly"
    - "yearly"
    - "threshold"
  threshold_pct: 5.0

simulation:
  n_simulations: 10000
  horizons:
    - 1
    - 3
    - 5
    - 10

risk_profiles:
  conservative:
    equity_max: 30
    debt_min: 50
    gold_max: 15
    cash_max: 15
    max_drawdown: 5.0

  moderate:
    equity_max: 60
    debt_min: 25
    gold_max: 10
    cash_max: 5
    max_drawdown: 15.0

  aggressive:
    equity_max: 85
    debt_min: 10
    gold_max: 5
    cash_max: 0
    max_drawdown: 30.0